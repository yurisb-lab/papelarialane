<!doctype html>
<html lang="pt-BR" data-theme="atelie" data-theme-default="atelie" data-theme-key="elane-tema">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Central de Criação Elane</title>
  <meta name="description" content="Central de Criação Elane: bottons, marcadores, cartões, capas e cadernos A5, com temas, kits e folha pronta para imprimir ou cortar na Silhouette.">
  <meta name="theme-color" content="#f7f2eb">
  <link rel="manifest" href="manifest.webmanifest">

  <meta name="apple-mobile-web-app-title" content="Elane">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="stylesheet" href="css/fonts.css">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/themes.css">
  <script>try{var t=localStorage.getItem('elane-tema');if(/^(atelie|rosa|azul|lilas|menta|coral)$/.test(t||''))document.documentElement.dataset.theme=t}catch(e){}</script>

<body>
  <header class="topbar">
    <a class="brand" href="#/" aria-label="Central de Criação Elane, ir para o início">
      <span class="brand__badge" aria-hidden="true">
        <svg viewBox="0 0 48 48" width="44" height="44"><circle cx="24" cy="24" r="22.5" fill="#fffdf9" stroke="#a5492b" style="fill:var(--surface);stroke:var(--berry)" stroke-width="1.2"/><circle cx="24" cy="24" r="19" fill="none" stroke="#a5492b" style="stroke:var(--berry)" stroke-width="0.6" stroke-dasharray="1.2 2.2"/><text x="24" y="31.5" text-anchor="middle" font-family="Fraunces, Georgia, serif" font-style="italic" font-size="23" font-weight="400" fill="#a5492b" style="fill:var(--berry)">E</text></svg>
      </span>
      <span class="brand__text">Central de Criação <span class="brand__name">Elane</span></span>
    </a>
    <div class="topbar__actions">
      <a class="home-link" href="#/">
        <svg class="ic" aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11.5 12 5l8 6.5"/><path d="M6.5 10v9.5h11V10"/><path d="M10 19.5v-5h4v5"/></svg>

  <main id="view" class="view"></main>

  <script type="module" src="js/app.js"></script>
